plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
	// Begleitprozess und Schemas in die Jar: Der Mod entpackt sie nach config/smartcraft/ und startet sie selbst.
	from("companion") {
		into "companion"
		include "*.py", "prompts/**", "requirements.txt", "README.md"
	}
	from("schemas") {
		into "schemas"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Mehrere Testserver gleichzeitig: Jeder bekommt mit -PaiRunDir=run/inst2 einen eigenen Spielordner
// (Welten, server.properties, Logs). Standard bleibt run/.
loom {
	runs {
		server {
			runDir = project.findProperty("aiRunDir") ?: "run"
		}
	}
}
